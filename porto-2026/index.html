<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c69"><title>PORTO 2026 · Concierge</title><style>html,body{margin:0;min-height:100%;background:#f7fbff;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:420px}.mark{width:56px;height:56px;margin:auto;border-radius:18px;background:linear-gradient(145deg,#123c69,#43a8ad);color:white;display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 16px 35px rgba(18,60,105,.18)}h1{font-size:28px;margin:16px 0 6px}p{font-size:13px;color:#6b7d8f;line-height:1.5}.bar{height:7px;background:#e3edf3;border-radius:999px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:45%;border-radius:999px;background:linear-gradient(90deg,#2d75b9,#6fc4c7);animation:m 1.1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(120%)}}button{min-height:44px;border:0;border-radius:14px;background:#123c69;color:white;padding:10px 16px;font-weight:800}</style></head><body><main><div class="box"><div class="mark">P</div><h1>PORTO 2026</h1><p id="status">Preparando vuestra guía de viaje…</p><div class="bar"><i></i></div></div></main><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Navegador antiguo');const parts=await Promise.all(['v5c1.txt','v5c2.txt','v5c3.txt'].map(x=>fetch(x+'?v=5').then(r=>{if(!r.ok)throw new Error('No se pudo cargar '+x);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.box').innerHTML='<div class="mark">P</div><h1>PORTO 2026</h1><p>No ha cargado bien la guía. Recarga la página con buena conexión.</p><button onclick="location.reload()">Reintentar</button>';console.error(e)}})();</script></body></html>
